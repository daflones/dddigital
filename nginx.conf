map $uri $ddtal_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control $ddtal_cache_control always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
  # Supabase and LiveKit projects are configurable; media workers use blob URLs.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co wss: https:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    try_files $uri =404;
  }
}
